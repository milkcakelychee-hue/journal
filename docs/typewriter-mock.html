<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typewriter mock</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#1C1C1E;--muted:#8E8E93;--bg:#F6F6F4;--blue:#A8C1DA;--blue-d:#7F9DBC;--blue-l:#C9DAEB;--paper:#F5F0E6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:'IBM Plex Sans Thai',system-ui;color:var(--ink);display:flex;justify-content:center}
.wrap{width:390px;padding:24px 16px 60px}
h2{font-size:20px;font-weight:500;margin:0 0 12px}
.q{background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 0 0 1px #EAEAEE;margin-bottom:18px}
.q small{display:block;font-size:12px;color:var(--muted)}
.q p{margin:2px 0 10px;font-size:16px;line-height:1.45}
.q .row{display:flex;gap:8px}.q button{flex:1;height:36px;border:0;border-radius:10px;font:inherit;font-size:14px;background:#F1F1F4;color:var(--ink)}.q button.p{background:var(--ink);color:#fff}
.stage{position:relative;height:560px;overflow:hidden}
/* กระดาษ */
.paper{position:absolute;left:50%;width:270px;margin-left:-135px;bottom:200px;min-height:390px;background:var(--paper);border-radius:2px 2px 0 0;
  box-shadow:0 1px 0 #E3DCCD inset,0 10px 30px rgba(0,0,0,.08),0 0 0 .5px #DDD5C5;padding:18px 20px 64px;transition:transform 2.4s cubic-bezier(.45,0,.55,1);z-index:1}
.paper:before{content:'';position:absolute;top:0;right:0;width:46px;height:20px;background:linear-gradient(200deg,var(--bg) 50%,transparent 51%)}
.hd{display:flex;justify-content:space-between;font-size:11px;border-bottom:1px solid #3A3A3C;padding-bottom:4px;letter-spacing:.3px}
.pq{font-size:12px;color:#8A8377;margin:14px 0 6px}
.ed{min-height:280px;background:repeating-linear-gradient(transparent 0 27px,#E6DECF 27px 28px);font-size:15px;line-height:28px;outline:0;color:#2A2A2C;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:14px}
.ed:empty:before{content:attr(data-ph);color:#B5AD9F}
.ed .ql{display:block;font-size:13px;color:#8A8377;line-height:28px;height:28px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ed *{line-height:28px}
.stage:after{content:'';position:absolute;left:0;right:0;top:0;height:40px;background:linear-gradient(var(--bg),transparent);z-index:1;pointer-events:none}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:9}
.pop.on{opacity:1;pointer-events:auto}
.pop .sheet{width:320px;max-height:86vh;display:flex;flex-direction:column;gap:12px;transform:translateY(20px);transition:transform .35s}
.pop.on .sheet{transform:none}
.pop .pv{background:var(--paper);border-radius:2px;padding:18px 20px;overflow:auto;box-shadow:0 20px 40px rgba(0,0,0,.25)}
.pop .row{display:flex;gap:8px}.pop button{flex:1;height:48px;border:0;border-radius:14px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}.pop button.p{background:var(--ink);color:#fff}
/* เครื่อง */
.tw{position:absolute;left:0;right:0;bottom:0;height:250px;z-index:2}
.platen{position:absolute;top:0;left:14px;right:14px;height:34px;border-radius:17px;background:linear-gradient(#3A3A3C,#1C1C1E 55%,#2C2C2E);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.knob{position:absolute;top:-4px;width:22px;height:42px;border-radius:7px;background:linear-gradient(90deg,#8FA9C4,#C9DAEB 45%,#8FA9C4);box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.knob.l{left:-8px}.knob.r{right:-8px}
.knob:after{content:'';position:absolute;inset:6px 4px;background:repeating-linear-gradient(#7E98B3 0 1.5px,transparent 1.5px 4px);border-radius:3px;opacity:.7}
.bail{position:absolute;top:10px;left:40px;right:40px;height:4px;border-radius:2px;background:linear-gradient(#F2F2F4,#9A9AA0);z-index:3}
.bail i{position:absolute;top:-3px;width:16px;height:10px;border-radius:3px;background:linear-gradient(#FAFAFA,#A5A5AA)}
.body{position:absolute;top:22px;left:0;right:0;bottom:0;border-radius:26px 26px 18px 18px;
  background:linear-gradient(180deg,#BFD3E6 0%,var(--blue) 22%,#9DB7D1 70%,#8DA8C4 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -6px 12px rgba(0,0,0,.08),0 16px 30px rgba(60,80,110,.22)}
.basket{position:absolute;top:12px;left:50%;width:190px;margin-left:-95px;height:40px;border-radius:95px 95px 6px 6px/40px 40px 6px 6px;background:#2C2C2E;overflow:hidden;box-shadow:inset 0 3px 6px rgba(0,0,0,.6)}
.basket:after{content:'';position:absolute;inset:5px 9px 0;border-radius:86px 86px 0 0/35px 35px 0 0;background:repeating-conic-gradient(from -70deg at 50% 100%,#B9B9BE 0 1.4deg,transparent 1.4deg 4.6deg);-webkit-mask:radial-gradient(circle at 50% 100%,transparent 18px,#000 19px)}
.slug{position:absolute;top:30px;left:50%;width:6px;height:24px;margin-left:-3px;background:linear-gradient(#D6D6DA,#8E8E93);border-radius:2px;transform-origin:50% 100%;transform:rotate(-80deg) scaleY(0);opacity:0}
.brand{position:absolute;top:58px;left:50%;transform:translateX(-50%);font-size:13px;letter-spacing:3px;font-weight:500;color:#D9E6F2;text-shadow:0 -1px 0 rgba(0,0,0,.18),0 1px 0 rgba(255,255,255,.5)}
.kb{position:absolute;left:18px;right:18px;bottom:14px;height:132px;border-radius:14px;background:#1F1F21;box-shadow:inset 0 4px 8px rgba(0,0,0,.6);padding:12px 10px 8px}
.r{display:flex;justify-content:center;gap:6px;margin-bottom:6px}.r:nth-child(2){padding-left:12px}.r:nth-child(3){padding-left:24px}
.k{width:24px;height:24px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#D9E6F2,#AFC6DD 70%);box-shadow:0 0 0 2px #C4C4C8,0 0 0 3px #6E6E73,0 3px 0 3px #0E0E10;transition:transform .08s}
.k.dn{transform:translateY(2px)}
.space{margin:6px auto 0;width:58%;height:14px;border-radius:7px;background:linear-gradient(#C9DAEB,#9DB7D1);box-shadow:0 3px 0 #0E0E10}
.go{position:absolute;left:0;right:0;bottom:-2px;z-index:4}
.save{display:block;width:100%;height:50px;border:0;border-radius:14px;background:var(--ink);color:#fff;font:inherit;font-size:16px;margin-top:14px}
.toast{text-align:center;font-size:14px;color:var(--muted);height:20px;margin-top:10px;opacity:0;transition:opacity .4s}
/* อนิเมชั่น */
.printing .paper{transform:translateY(calc(-100% - 260px))}
.printing .platen{animation:roll 2.4s linear}
@keyframes roll{to{filter:brightness(1.4)}}
.newpaper{animation:feed .7s .2s both cubic-bezier(.2,.7,.3,1)}
@keyframes feed{from{transform:translateY(360px)}to{transform:none}}
</style></head><body><div class="wrap">
<h2>เขียนสักหน่อย</h2>
<div class="q"><small>คำถามวันนี้ · ไม่ต้องตอบก็ได้</small><p id="q">วันนี้อยากขอบคุณใครเป็นพิเศษ</p>
  <div class="row"><button id="chg">เปลี่ยนข้อ</button><button class="p" id="ans">ตอบข้อนี้</button></div></div>
<div class="stage" id="st">
  <div class="paper" id="pp"><div class="hd"><span>พฤ 26 พ.ย. 2569</span><span>no.012</span></div><div class="ed" id="ta" contenteditable="true" data-ph="พิมพ์ได้เลย..."></div></div>
  <div class="tw"><div class="platen"><span class="knob l"></span><span class="knob r"></span></div>
    <div class="bail"><i style="left:22%"></i><i style="right:22%"></i></div>
    <div class="body"><div class="basket"></div><div class="slug" id="slug"></div><div class="brand">JOURNAL</div>
      <div class="kb" id="kb"></div></div></div>
</div>
<button class="save" id="sv">พิมพ์ออกมา</button><div class="toast" id="to">เก็บไว้ในแฟ้มแล้ว</div>
<div class="pop" id="pop"><div class="sheet"><div class="pv" id="pv"></div><div class="row"><button id="ed">แก้ไข</button><button class="p" id="keep">เก็บใส่แฟ้ม</button></div></div></div>
</div>
<script>
const kb=document.getElementById('kb');[10,9,8].forEach(n=>{kb.insertAdjacentHTML('beforeend',`<div class="r">${'<span class="k"></span>'.repeat(n)}</div>`)});kb.insertAdjacentHTML('beforeend','<div class="space"></div>');
const keys=[...document.querySelectorAll('.k')],Q=['วันนี้อยากขอบคุณใครเป็นพิเศษ','เรื่องเล็ก ๆ ที่ทำให้ยิ้มวันนี้คืออะไร','ถ้าวันนี้มีสี จะเป็นสีอะไร','ก้าวเล็ก ๆ ที่ทำได้พรุ่งนี้คืออะไร'];let qi=0;
const slug=document.getElementById('slug');
document.getElementById('ta').addEventListener('input',()=>{const k=keys[Math.random()*keys.length|0];k.classList.add('dn');setTimeout(()=>k.classList.remove('dn'),90);
 slug.animate([{opacity:1,transform:'rotate(-70deg) scaleY(1)'},{opacity:1,transform:'rotate(0deg) scaleY(1)'},{opacity:0,transform:'rotate(-70deg) scaleY(1)'}],{duration:140})});
chg.onclick=()=>{qi=(qi+1)%Q.length;q.textContent=Q[qi]};
// ตอบข้อนี้ → คำถามไปต่อบรรทัดล่างของที่พิมพ์ไว้ แล้วเคอร์เซอร์อยู่บรรทัดใหม่ใต้คำถาม
ans.onclick=()=>{const ql=document.createElement('span');ql.className='ql';ql.contentEditable='false';ql.textContent=Q[qi];
 ta.append(ql);const t=document.createTextNode('\u200b');ta.append(t);
 ta.focus();const rg=document.createRange();rg.setStart(t,1);rg.collapse(true);const sl=getSelection();sl.removeAllRanges();sl.addRange(rg)};
// พิมพ์ออกมา → กระดาษเลื่อนออกช้า ๆ แล้วโชว์ป๊อปอัปหน้ากระดาษ
sv.onclick=()=>{st.classList.add('printing');setTimeout(()=>{pv.innerHTML=pp.innerHTML.replace('contenteditable="true"','');pop.classList.add('on')},2300)};
ed.onclick=()=>{pop.classList.remove('on');st.classList.remove('printing')};
keep.onclick=()=>{pop.classList.remove('on');to.style.opacity=1;st.classList.remove('printing');pp.style.transition='none';ta.innerHTML='';pp.classList.add('newpaper');
 setTimeout(()=>{pp.classList.remove('newpaper');pp.style.transition='';to.style.opacity=0},1400)};
</script></body></html>
